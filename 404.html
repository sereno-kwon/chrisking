<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CHRIS KING KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/hubs, /en/headsets ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/chrisking/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/chrisking/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'headset':'headsets', 'nothreadset':'headsets', 'inset':'headsets', 'dropset':'headsets', 'hub':'hubs', 'r45':'hubs', 'iso':'hubs', 'mtn':'hubs', 'ringdrive':'hubs',
                'bottom-bracket':'bb', 'bottom-brackets':'bb', 'threadfit':'bb', 'pressfit':'bb', 'color':'colors', 'colour':'colors', 'colours':'colors', 'warranty':'service',
                'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, headsets:1, hubs:1, bb:1, colors:1, service:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
